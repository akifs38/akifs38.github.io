; Elçin firmware — ESP32-C3
;
; Cihazın "beyni" (src/core) Arduino'dan bağımsız taşınabilir C++'tır ve
; masaüstünde derlenip test edilir (bkz. test/Makefile). Buradaki ortam
; yalnızca gerçek donanım için.

[platformio]
default_envs = elcin

[env:elcin]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  ; Sürüm tek yerde: OTA karşılaştırması da, heartbeat da bunu okur.
  -D ELCIN_FIRMWARE_VERSION='"1.0.0"'
  ; Native USB CDC olmadan seri günlük sessiz kalır.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  ; Sıcak döngüde çalışan çizim kodu boyuttan çok hıza bakar.
  -O2

build_unflags = -Os

lib_deps =
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit GFX Library @ ^1.11.11
  bblanchon/ArduinoJson @ ^7.2.0
  links2004/WebSockets @ ^2.6.1

; Gizli bilgiler (Wi-Fi parolası, cihaz anahtarı) derlemeye gömülmez;
; NVS'e yazılır. Bkz. src/hw/Settings.h ve README.
