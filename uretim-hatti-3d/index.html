<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5b301">
<title>3D Üretim Hattı Takibi · Otomasyon Akademi</title>
<meta name="description" content="S7-300 PLC motor ve sensör adreslerine göre üretim hattının 3 boyutlu canlı takibi. 4 konveyör, kross (90° dönüş), asansör ve üst kat konveyörleri.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f5b301'/%3E%3Cpath d='M20 60 h60 v10 h-60 z M28 55 a6 6 0 1 0 0.1 0 M72 55 a6 6 0 1 0 0.1 0' fill='%23000'/%3E%3C/svg%3E">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#2a323d;
    --ink:#e8edf2; --muted:#8a96a3; --accent:#f5b301; --accent-2:#ff7a18;
    --live:#27d07a; --dead:#3a4450; --danger:#ff4d4f; --info:#3aa0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Oswald',sans-serif;background:var(--bg);color:var(--ink)}
  canvas{display:block}
  #scene{position:fixed;inset:0;z-index:0}

  /* Üst bar */
  header{position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px 16px;background:rgba(22,27,34,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:6px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;color:#000;font-weight:700;font-size:18px}
  .brand h1{font-size:15px;letter-spacing:1px;text-transform:uppercase;font-weight:600}
  .brand p{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  header .sp{flex:1}

  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--panel-2);color:var(--muted);border:none;
    padding:8px 12px;font-family:inherit;font-size:12px;letter-spacing:.5px;
    text-transform:uppercase;cursor:pointer;font-weight:600}
  .seg button.on{background:var(--accent);color:#000}

  .btn{font-family:inherit;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    font-size:12px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
    padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .btn:active{filter:brightness(.9)}
  .btn.acc{background:var(--accent);color:#000;border-color:var(--accent)}
  .field{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px}
  .field input[type=range]{width:100px;accent-color:var(--accent)}
  .field input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--ink);
    font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 8px;border-radius:6px;width:210px}

  /* Sağ I/O paneli */
  aside{position:fixed;top:64px;right:12px;bottom:12px;z-index:15;width:266px;max-width:calc(100vw - 24px);
    background:rgba(22,27,34,.9);backdrop-filter:blur(8px);border:1px solid var(--line);
    border-radius:12px;padding:12px;overflow-y:auto}
  aside h3{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
    margin:4px 2px 8px;display:flex;align-items:center;gap:6px}
  aside h3::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .io{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;
    background:var(--panel);border:1px solid var(--line);margin-bottom:6px}
  .io .led{width:12px;height:12px;border-radius:50%;background:var(--dead);flex:none;
    box-shadow:0 0 0 0 rgba(0,0,0,0);transition:.12s}
  .io.q .led.on{background:var(--live);box-shadow:0 0 10px 1px var(--live)}
  .io.i .led.on{background:var(--info);box-shadow:0 0 10px 1px var(--info)}
  .io .name{flex:1;font-size:12px;letter-spacing:.5px}
  .io .adr{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
    background:var(--bg);padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
  .io.q.act{border-color:var(--live)}
  .io.i.act{border-color:var(--info)}

  /* 3D üzerindeki etiketler */
  #labels{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-100%);
    font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.25;
    background:rgba(14,17,22,.82);border:1px solid var(--line);border-radius:6px;
    padding:3px 7px;white-space:nowrap;color:var(--ink);
    transition:border-color .1s, box-shadow .1s}
  .lbl b{color:var(--accent);letter-spacing:.5px}
  .lbl .s{color:var(--muted)}
  .lbl.run{border-color:var(--live);box-shadow:0 0 10px -2px var(--live)}
  .lbl .qd,.lbl .id{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--dead);vertical-align:middle;margin-right:3px}
  .lbl .qd.on{background:var(--live)} .lbl .id.on{background:var(--info)}

  #hint{position:fixed;left:12px;bottom:12px;z-index:15;font-size:11px;color:var(--muted);
    background:rgba(22,27,34,.8);border:1px solid var(--line);border-radius:8px;padding:7px 11px;
    letter-spacing:.3px;max-width:56vw}
  #hint b{color:var(--ink)}
  a.back{position:fixed;left:16px;bottom:auto;color:var(--muted);text-decoration:none}
  @media(max-width:720px){
    aside{width:210px;top:auto;bottom:12px;right:12px;max-height:44vh}
    #hint{max-width:44vw;font-size:10px}
    .field input[type=text]{width:120px}
    .brand p{display:none}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="labels"></div>

<header>
  <div class="brand">
    <div class="logo">◨</div>
    <div><h1>3D Üretim Hattı Takibi</h1><p>S7-300 · Motor & Sensör Adresleri</p></div>
  </div>
  <div class="sp"></div>

  <div class="seg" id="mode">
    <button data-mode="sim" class="on">Simülasyon</button>
    <button data-mode="live">Canlı (PLC)</button>
  </div>

  <div class="field" id="speedWrap">Hız
    <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
  </div>

  <div class="field" id="liveWrap" style="display:none">JSON
    <input type="text" id="jsonUrl" placeholder="https://.../plc.json" value="plc.json">
    <button class="btn" id="pollBtn">Bağlan</button>
  </div>

  <button class="btn" id="viewBtn">Görünüm</button>
  <button class="btn acc" id="resetBtn">Sıfırla</button>
</header>

<aside id="iopanel"></aside>

<div id="hint"><b>Sürükle</b> döndür · <b>tekerlek</b> yakınlaştır · <b>sağ tık</b> kaydır — Yeşil LED = motor çalışıyor, mavi LED = sensör algıladı</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1) HAT TANIMI  —  S7-300 ADRESLERİNİ BURADAN DEĞİŞTİR
   ------------------------------------------------------------
   Her eleman:  motor = çıkış (Q),  sensör = giriş (I)
   type: 'conveyor' | 'cross' | 'elevator'
   Asansörler: dir 'up' (yükselme) / 'down' (alçalma)
   ============================================================ */
const LINE = [
  { id:'K1', label:'Konveyör 1', type:'conveyor', motor:'Q0.0', sensor:'I0.0' },
  { id:'K2', label:'Konveyör 2', type:'conveyor', motor:'Q0.1', sensor:'I0.1' },
  { id:'K3', label:'Konveyör 3', type:'conveyor', motor:'Q0.2', sensor:'I0.2' },
  { id:'K4', label:'Konveyör 4', type:'conveyor', motor:'Q0.3', sensor:'I0.3' },

  { id:'KR', label:'Kross (90° dönüş)', type:'cross', motor:'Q0.4', rotMotor:'Q0.5', sensor:'I0.4' },

  { id:'A1', label:'Asansör 1 (yükselme)', type:'elevator', dir:'up',
    motor:'Q0.6', sensorBottom:'I0.5', sensorTop:'I0.6' },

  { id:'K5', label:'Üst Konveyör 5', type:'conveyor', motor:'Q0.7', sensor:'I0.7' },
  { id:'K6', label:'Üst Konveyör 6', type:'conveyor', motor:'Q1.0', sensor:'I1.0' },
  { id:'K7', label:'Üst Konveyör 7', type:'conveyor', motor:'Q1.1', sensor:'I1.1' },
  { id:'K8', label:'Üst Konveyör 8', type:'conveyor', motor:'Q1.2', sensor:'I1.2' },

  { id:'A2', label:'Asansör 2 (alçalma)', type:'elevator', dir:'down',
    motor:'Q1.3', sensorTop:'I1.3', sensorBottom:'I1.4' },

  { id:'K9',  label:'Konveyör 9',  type:'conveyor', motor:'Q1.4', sensor:'I1.5' },
  { id:'K10', label:'Konveyör 10', type:'conveyor', motor:'Q1.5', sensor:'I1.6' },
  { id:'K11', label:'Konveyör 11', type:'conveyor', motor:'Q1.6', sensor:'I1.7' },
  { id:'K12', label:'Konveyör 12', type:'conveyor', motor:'Q1.7', sensor:'I2.0' },
];

const STEP = 5;      // elemanlar arası mesafe (sahne birimi)
const UPPER = 6;     // üst kat yüksekliği
const GROUND_Y = 1;  // konveyör üst yüzeyi (zemin kat)

/* ============================================================
   2) PLC DURUM HARİTASI  (adres -> bool)
   Simülasyonda dahili denetleyici, canlıda JSON doldurur.
   ============================================================ */
const plc = {};                          // { 'Q0.0': false, 'I0.0': false, ... }
const allQ = [], allI = [];
for (const st of LINE) {
  for (const k of ['motor','rotMotor']) if (st[k]) { plc[st[k]] = false; allQ.push({adr:st[k], st, role:k}); }
  for (const k of ['sensor','sensorTop','sensorBottom']) if (st[k]) { plc[st[k]] = false; allI.push({adr:st[k], st, role:k}); }
}
const setBit = (adr, v) => { if (adr) plc[adr] = !!v; };
const getBit = (adr) => !!plc[adr];

/* ============================================================
   3) SAHNE KURULUMU
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
scene.fog = new THREE.Fog(0x0e1116, 55, 130);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
camera.position.set(34, 30, 46);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(16, 4, 20);
controls.maxPolarAngle = Math.PI*0.49;

scene.add(new THREE.AmbientLight(0xb8c4d8, 0.5));
const hemi = new THREE.HemisphereLight(0x9fb4d0, 0x20262e, 0.7); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe7bd, 1.5);
sun.position.set(30, 48, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, { left:-60, right:60, top:60, bottom:-60, near:1, far:160 });
scene.add(sun);

// Zemin
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color:0x141a21, roughness:.98 })
);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(200, 40, 0x2a323d, 0x1b222b);
grid.position.y = 0.01; scene.add(grid);

/* ============================================================
   4) GEOMETRİ YARDIMCILARI
   ============================================================ */
const MAT = {
  frame:   new THREE.MeshStandardMaterial({ color:0x39424e, roughness:.7, metalness:.3 }),
  belt:    new THREE.MeshStandardMaterial({ color:0x11161c, roughness:.95 }),
  roller:  new THREE.MeshStandardMaterial({ color:0x6b7684, roughness:.4, metalness:.6 }),
  leg:     new THREE.MeshStandardMaterial({ color:0x2b333d, roughness:.8 }),
  cross:   new THREE.MeshStandardMaterial({ color:0x3a4656, roughness:.6, metalness:.35 }),
  rail:    new THREE.MeshStandardMaterial({ color:0xf5b301, roughness:.5, metalness:.4 }),
  plat:    new THREE.MeshStandardMaterial({ color:0x4a5666, roughness:.6, metalness:.35 }),
  product: new THREE.MeshStandardMaterial({ color:0xff7a18, roughness:.55 }),
};
const box = (w,h,d,m) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);

function legsUnder(group, w, d, topY){
  for (const sx of [-1,1]) for (const sz of [-1,1]) {
    const leg = box(0.35, topY, 0.35, MAT.leg);
    leg.position.set(sx*(w/2-0.4), topY/2, sz*(d/2-0.4));
    leg.castShadow = true; group.add(leg);
  }
}

// along: 'x' veya 'z' — bant yönü
function makeConveyor(along, topY){
  const g = new THREE.Group();
  const L = STEP*0.94, W = 2.4;
  const w = along==='x'? L : W, d = along==='x'? W : L;
  const frame = box(w, 0.5, d, MAT.frame); frame.position.y = topY; frame.castShadow = frame.receiveShadow = true; g.add(frame);
  const belt  = box(w-0.3, 0.14, d-0.3, MAT.belt); belt.position.y = topY+0.3; g.add(belt);
  // rulolar
  const rollers = [];
  const n = 6, axisLen = W-0.2;
  for (let i=0;i<n;i++){
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,axisLen,14), MAT.roller);
    const t = (i/(n-1)-0.5)*(L-0.6);
    if (along==='x'){ r.rotation.x = Math.PI/2; r.position.set(t, topY+0.32, 0); }
    else            { r.rotation.z = Math.PI/2; r.position.set(0, topY+0.32, t); }
    g.add(r); rollers.push(r);
  }
  legsUnder(g, w, d, topY-0.25>0?topY-0.25:0.25);
  g.userData.rollers = rollers; g.userData.along = along;
  return g;
}

function makeCross(topY){
  const g = new THREE.Group();
  const base = box(3.0, 0.5, 3.0, MAT.frame); base.position.y = topY; base.castShadow=true; g.add(base);
  const turn = new THREE.Group(); turn.position.y = topY+0.35; g.add(turn);
  const disk = new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.22,28), MAT.cross); turn.add(disk);
  // dönen tabla üstünde küçük taşıma ruloları
  for (let i=-1;i<=1;i++){
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,2.4,12), MAT.roller);
    r.rotation.x = Math.PI/2; r.position.set(i*0.7, 0.2, 0); turn.add(r);
  }
  legsUnder(g, 3, 3, topY-0.25);
  g.userData.turn = turn;
  return g;
}

// Asansör: zeminden UPPER'a giden dikey birim
function makeElevator(){
  const g = new THREE.Group();
  const H = UPPER + GROUND_Y + 0.6;
  for (const sx of [-1,1]){
    const rail = box(0.28, H, 0.28, MAT.rail);
    rail.position.set(sx*1.3, H/2, -1.3); rail.castShadow=true; g.add(rail);
    const rail2 = box(0.28, H, 0.28, MAT.rail);
    rail2.position.set(sx*1.3, H/2, 1.3); g.add(rail2);
  }
  const top = box(3.2, 0.25, 3.2, MAT.frame); top.position.y = H; g.add(top);
  const plat = new THREE.Group(); g.add(plat);
  const pb = box(2.7, 0.4, 2.7, MAT.plat); plat.add(pb);
  const pbelt = box(2.4, 0.12, 2.4, MAT.belt); pbelt.position.y = 0.26; plat.add(pbelt);
  pb.castShadow = true;
  g.userData.plat = plat; g.userData.H = H;
  return g;
}

/* ============================================================
   5) HAT DÜZENİ  — LINE'dan pozisyonları ve yolu üret
   ============================================================ */
const lineGroup = new THREE.Group(); scene.add(lineGroup);
const path = [];   // ürün yolu: {pos, drive, sensor, id}

(function buildLayout(){
  let x = 0, z = 0, along = 'x', level = 'ground';

  // giriş noktası (K1 öncesi)
  path.push({ pos:new THREE.Vector3(-STEP*0.6, GROUND_Y+0.55, 0), drive:LINE[0].motor, sensor:null, id:'IN' });

  for (const st of LINE){
    const topY = level==='upper' ? UPPER+GROUND_Y : GROUND_Y;   // bant üst yüzeyi
    st._pos = new THREE.Vector3(x, 0, z);
    st._along = along; st._level = level; st._topY = topY;
    const surfY = topY + 0.4;   // ürünün oturduğu yükseklik

    if (st.type === 'conveyor'){
      const mesh = makeConveyor(along, topY); mesh.position.set(x,0,z); lineGroup.add(mesh);
      st._mesh = mesh;
      path.push({ pos:new THREE.Vector3(x, surfY, z), drive:st.motor, sensor:st.sensor, id:st.id });

    } else if (st.type === 'cross'){
      const mesh = makeCross(topY); mesh.position.set(x,0,z); lineGroup.add(mesh);
      st._mesh = mesh;
      path.push({ pos:new THREE.Vector3(x, surfY, z), drive:st.motor, sensor:st.sensor, id:st.id, cross:true });
      along = 'z';   // kross sonrası 90° dönüş

    } else if (st.type === 'elevator'){
      const mesh = makeElevator(); mesh.position.set(x,0,z); lineGroup.add(mesh);
      st._mesh = mesh;
      const yBottom = GROUND_Y + 0.4, yTop = UPPER + GROUND_Y + 0.4;
      if (st.dir === 'up'){
        path.push({ pos:new THREE.Vector3(x, yBottom, z), drive:st.motor, sensor:st.sensorBottom, id:st.id, elev:st, phase:'enter' });
        path.push({ pos:new THREE.Vector3(x, yTop,    z), drive:st.motor, sensor:st.sensorTop,    id:st.id, elev:st, phase:'up' });
        level = 'upper';
      } else {
        path.push({ pos:new THREE.Vector3(x, yTop,    z), drive:st.motor, sensor:st.sensorTop,    id:st.id, elev:st, phase:'enter' });
        path.push({ pos:new THREE.Vector3(x, yBottom, z), drive:st.motor, sensor:st.sensorBottom, id:st.id, elev:st, phase:'down' });
        level = 'ground';
      }
    }

    if (along === 'x') x += STEP; else z += STEP;
  }
  // çıkış noktası
  const last = path[path.length-1].pos;
  path.push({ pos:new THREE.Vector3(last.x, last.y, last.z + STEP*0.7), drive:LINE[LINE.length-1].motor, sensor:null, id:'OUT' });
})();

// Ürün kutusu
const product = box(1.1, 1.0, 1.1, MAT.product);
product.castShadow = true; scene.add(product);
const prodEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(product.geometry),
  new THREE.LineBasicMaterial({ color:0xffd9a0 })
); product.add(prodEdges);

/* ============================================================
   6) ÜRÜN HAREKET DURUMU
   ============================================================ */
const track = {
  seg: 0,        // hangi yol parçasında (path[seg] -> path[seg+1])
  t: 0,          // parça içi ilerleme 0..1
  speed: 1,      // hız çarpanı
};
function resetProduct(){ track.seg = 0; track.t = 0; placeProduct(); }
function placeProduct(){
  const a = path[track.seg].pos, b = path[Math.min(track.seg+1, path.length-1)].pos;
  product.position.lerpVectors(a, b, track.t);
}

/* ============================================================
   7) SİMÜLASYON DENETLEYİCİSİ
   Ürünün bulunduğu parçanın motorunu ON yapar (sanal PLC).
   ============================================================ */
let mode = 'sim';
function simControl(dt){
  // tüm bitleri temizle, sonra aktif olanları yak
  for (const a of allQ) plc[a.adr] = false;
  for (const a of allI) plc[a.adr] = false;

  const wp = path[track.seg+1] || path[track.seg];
  // hareketi süren motor
  setBit(wp.drive, true);
  // kross dönerken rotMotor
  const stCross = LINE.find(s => s.id === wp.id && s.type==='cross');
  if (stCross && track.t > 0.15 && track.t < 0.85) setBit(stCross.rotMotor, true);

  // ilerlet
  const a = path[track.seg].pos, b = wp.pos;
  const segLen = a.distanceTo(b) || 0.001;
  track.t += (track.speed * 4.5 * dt) / segLen;
  if (track.t >= 1){
    track.t = 0; track.seg++;
    if (track.seg >= path.length-1){ track.seg = 0; }   // döngü: baştan
  }
  placeProduct();

  // sensör: ürün bir istasyon merkezine yakınsa o sensör ON
  markSensorsByProduct();
}

// Ürün konumuna göre en yakın istasyonun sensörünü yak (hem sim hem canlı görsel)
function markSensorsByProduct(){
  let best = null, bestD = 1e9;
  for (const wp of path){
    if (!wp.sensor) continue;
    const d = product.position.distanceTo(wp.pos);
    if (d < bestD){ bestD = d; best = wp; }
  }
  if (best && bestD < 1.4) setBit(best.sensor, true);
}

/* ============================================================
   8) CANLI MOD  — JSON'dan { "Q0.0":true, "I0.0":false ... }
   Ürün, aktif olan en ileri sensöre göre takip edilir.
   ============================================================ */
let pollTimer = null, jsonUrl = 'plc.json';
async function pollOnce(){
  try{
    const r = await fetch(jsonUrl, { cache:'no-store' });
    const data = await r.json();
    for (const k in data) if (k in plc) plc[k] = !!data[k];
    updateProductFromSensors();
  }catch(e){ /* sessiz geç — bağlantı yoksa son durumu koru */ }
}
function startPolling(){ stopPolling(); pollOnce(); pollTimer = setInterval(pollOnce, 400); }
function stopPolling(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

// Canlı modda: aktif olan en ileri (downstream) sensörün yol noktasına ürünü sürükle
let liveTargetSeg = 0;
function updateProductFromSensors(){
  for (let i = path.length-1; i >= 0; i--){
    if (path[i].sensor && getBit(path[i].sensor)){ liveTargetSeg = i; break; }
  }
}
function liveControl(dt){
  // hedefe doğru yumuşak ilerle
  const targetSeg = liveTargetSeg;
  if (track.seg < targetSeg){ track.t += dt*track.speed*1.6; if (track.t>=1){track.t=0;track.seg++;} }
  else if (track.seg > targetSeg){ track.seg = targetSeg; track.t = 0; }
  else { track.t += (1-track.t)*Math.min(1, dt*4); }
  placeProduct();
}

/* ============================================================
   9) GÖRSEL GÜNCELLEME — motor dönerse ruloları/etiketleri yak
   ============================================================ */
const labelEls = {};
(function buildLabels(){
  const cont = document.getElementById('labels');
  for (const st of LINE){
    const el = document.createElement('div'); el.className = 'lbl';
    const sensAdr = st.sensor || st.sensorBottom || '';
    el.innerHTML = `<span class="qd"></span><b>${st.id}</b> ${st.motor}` +
                   (sensAdr ? `<br><span class="id"></span><span class="s">${sensAdr}</span>` : '');
    cont.appendChild(el); labelEls[st.id] = el;
  }
})();

function updateVisuals(){
  for (const st of LINE){
    const on = getBit(st.motor);
    // kross tabla dönüşü
    if (st.type==='cross' && st._mesh){ if (getBit(st.rotMotor)) st._mesh.userData.turn.rotation.y += 0.03; }
    // asansör platform yüksekliği: ürün asansördeyse ürünle beraber
    if (st.type==='elevator' && st._mesh){
      const plat = st._mesh.userData.plat;
      const wp = path[track.seg+1] || path[track.seg];
      const onThis = wp && wp.id===st.id;
      let y = st.dir==='up' ? 0.4 : (UPPER+GROUND_Y-0.6+0.4);
      if (onThis) y = product.position.y - 0.9;
      plat.position.y = y;
    }
    // etiket ledleri
    const el = labelEls[st.id];
    if (el){
      el.classList.toggle('run', on);
      const qd = el.querySelector('.qd'); if (qd) qd.classList.toggle('on', on);
      const sAdr = st.sensor || st.sensorBottom;
      const idd = el.querySelector('.id'); if (idd) idd.classList.toggle('on', getBit(sAdr) || getBit(st.sensorTop));
    }
  }
}

// bant rulolarını dönme animasyonu (motor açıkken)
function spinRollers(dt){
  for (const st of LINE){
    if (st._mesh?.userData.rollers && getBit(st.motor)){
      for (const r of st._mesh.userData.rollers) r.rotateY(dt*6);
    }
  }
}

/* ============================================================
   10) I/O PANELİ (sağ liste)
   ============================================================ */
const ioEls = {};
(function buildIO(){
  const p = document.getElementById('iopanel');
  const hq = document.createElement('h3'); hq.textContent = `Motorlar (Çıkış · Q) — ${allQ.length}`; p.appendChild(hq);
  for (const a of allQ){
    const row = document.createElement('div'); row.className='io q';
    const roleTxt = a.role==='rotMotor' ? 'dönüş' : a.st.label;
    row.innerHTML = `<span class="led"></span><span class="name">${a.st.id} <small style="color:var(--muted)">${roleTxt}</small></span><span class="adr">${a.adr}</span>`;
    p.appendChild(row); ioEls[a.adr] = row;
  }
  const hi = document.createElement('h3'); hi.textContent = `Sensörler (Giriş · I) — ${allI.length}`; hi.style.marginTop='12px'; p.appendChild(hi);
  for (const a of allI){
    const row = document.createElement('div'); row.className='io i';
    const roleTxt = a.role==='sensorTop'?'üst':a.role==='sensorBottom'?'alt':'algılama';
    row.innerHTML = `<span class="led"></span><span class="name">${a.st.id} <small style="color:var(--muted)">${roleTxt}</small></span><span class="adr">${a.adr}</span>`;
    p.appendChild(row); ioEls[a.adr] = row;
  }
})();
function updateIO(){
  for (const adr in ioEls){
    const on = getBit(adr);
    const row = ioEls[adr];
    row.querySelector('.led').classList.toggle('on', on);
    row.classList.toggle('act', on);
  }
}

/* ============================================================
   11) EKRAN ETİKETLERİNİ 3D->2D projekte et
   ============================================================ */
const _v = new THREE.Vector3();
function projectLabels(){
  for (const st of LINE){
    const el = labelEls[st.id]; if (!el) continue;
    _v.copy(st._pos); _v.y = st._topY + 2.2;
    _v.project(camera);
    const behind = _v.z > 1;
    if (behind){ el.style.display='none'; continue; }
    el.style.display='block';
    el.style.left = (( _v.x*0.5+0.5)*innerWidth) + 'px';
    el.style.top  = ((-_v.y*0.5+0.5)*innerHeight) + 'px';
  }
}

/* ============================================================
   12) ANA DÖNGÜ
   ============================================================ */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (mode === 'sim') simControl(dt); else liveControl(dt);
  spinRollers(dt);
  updateVisuals();
  updateIO();
  projectLabels();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
resetProduct();
requestAnimationFrame(loop);

/* ============================================================
   13) ARAYÜZ KONTROLLERİ
   ============================================================ */
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#mode button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  mode = b.dataset.mode;
  document.getElementById('speedWrap').style.display = mode==='sim' ? '' : 'none';
  document.getElementById('liveWrap').style.display  = mode==='live' ? 'flex' : 'none';
  if (mode==='live'){ startPolling(); } else { stopPolling(); }
});
document.getElementById('speed').oninput = e => track.speed = parseFloat(e.target.value);
document.getElementById('resetBtn').onclick = () => { resetProduct(); liveTargetSeg = 0; };
document.getElementById('pollBtn').onclick = () => { jsonUrl = document.getElementById('jsonUrl').value.trim() || jsonUrl; startPolling(); };

// Görünüm önayarları
const views = [
  { pos:[34,30,46], tgt:[16,4,20] },   // izometrik
  { pos:[16,55,22], tgt:[16,2,20] },   // kuşbakışı
  { pos:[-6,10,0],  tgt:[16,3,10] },   // giriş tarafı
];
let vi = 0;
document.getElementById('viewBtn').onclick = () => {
  vi = (vi+1)%views.length; const v = views[vi];
  camera.position.set(...v.pos); controls.target.set(...v.tgt);
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
